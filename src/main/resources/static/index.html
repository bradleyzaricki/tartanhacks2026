<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>reprompted.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root{
            --bg: #11110e;
            --panel: #171612;
            --border: #2b281f;
            --text: #f2efe6;
            --muted: #b9b19c;
            --accent: #7a8f5a;
            --accent2: #c2a66d;
            --danger: #c26a6a;
            --radius: 14px;
            --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }

        *{ box-sizing: border-box }

        html, body{
            margin: 0;
            height: 100%;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* FULL SCREEN LAYOUT */
        .center{
            position: fixed;
            inset: 0;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 24px;
        }

        .stack{
            width: min(1380px, 98vw);
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* RESPONSE WINDOW NOW FILLS AVAILABLE SPACE */
        .response-box{
            flex: 1 1 auto;
            margin: 0;
            padding: 12px;
            border-radius: var(--radius);
            background: rgba(23,22,18,0.85);
            border: 1px solid var(--border);
            overflow-y: auto;
            min-height: 0; /* important for flex scrolling */
        }

        .response-entry{
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px;
            white-space: pre-wrap;
            line-height: 1.45;
        }

        .response-header{
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .tag{
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid;
            white-space: nowrap;
        }

        .tag.recycled{
            border-color: rgba(122,143,90,0.6);
            color: var(--accent);
            background: rgba(122,143,90,0.15);
        }

        .tag.regenerated{
            border-color: rgba(194,106,106,0.8);
            color: var(--danger);
            background: rgba(194,106,106,0.15);
        }

        .prompt-line{
            font-size: 13px;
            color: var(--muted);
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .prompt-label{
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(185,177,156,0.75);
            flex: 0 0 auto;
        }

        .prompt-tags{
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
        }

        .prompt-text{
            margin-left: 6px;
            color: var(--text);
            opacity: 0.92;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1 1 auto;
        }

        .response-body{
            white-space: pre-wrap;
            line-height: 1.45;
        }

        /* INPUT BOX LOWER (more breathing room above it) */
        .input-box{
            display: flex;
            gap: 10px;
            padding: 12px;
            border-radius: var(--radius);
            background: var(--panel);
            border: 1px solid var(--border);
            margin-top: 10px; /* pushes it a bit lower */
        }

        textarea{
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            padding: 10px;
            line-height: 1.35;
        }

        textarea::placeholder{
            color: var(--muted);
        }

        button.send{
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(194,166,109,0.5);
            background: rgba(194,166,109,0.18);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        button.send:hover{
            background: rgba(194,166,109,0.28);
        }

        .feedback{
            display: none;
            padding: 10px 12px;
            border-radius: var(--radius);
            background: rgba(23,22,18,0.85);
            border: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .fb{
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            background: transparent;
            color: var(--text);
        }

        .fb.good{
            border-color: rgba(122,143,90,0.6);
            background: rgba(122,143,90,0.15);
        }

        .fb.good:hover{
            background: rgba(122,143,90,0.25);
        }

        .fb.bad{
            border-color: rgba(194,106,106,0.7);
            background: rgba(194,106,106,0.15);
        }

        .fb.bad:hover{
            background: rgba(194,106,106,0.25);
        }

        .disabled{
            opacity: 0.55;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div class="center">
    <div class="stack">

        <div id="response-box" class="response-box"></div>

        <div class="input-box">
            <textarea id="input" rows="1" placeholder="Message…"></textarea>
            <button id="send" class="send">Send</button>
        </div>

        <div id="feedback" class="feedback">
            <span style="font-size:13px;color:var(--muted)">
                Was this a good recycled response?
            </span>
            <div style="display:flex;gap:8px">
                <button id="good" class="fb good">Good</button>
                <button id="bad" class="fb bad">Bad</button>
            </div>
        </div>

    </div>
</div>

<script>
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const feedback = document.getElementById("feedback");
    const responseBox = document.getElementById("response-box");
    const goodBtn = document.getElementById("good");
    const badBtn = document.getElementById("bad");

    let lastPrompt = "";
    let busy = false;

    function setBusy(v){
        busy = v;
        if (v){
            send.classList.add("disabled");
            goodBtn.classList.add("disabled");
            badBtn.classList.add("disabled");
        } else {
            send.classList.remove("disabled");
            goodBtn.classList.remove("disabled");
            badBtn.classList.remove("disabled");
        }
    }

    function appendResponse({ prompt, response, recycled = false, regenerated = false } = {}) {
        const entry = document.createElement("div");
        entry.className = "response-entry";

        const header = document.createElement("div");
        header.className = "response-header";

        if (prompt != null && String(prompt).length > 0) {
            const promptLine = document.createElement("div");
            promptLine.className = "prompt-line";

            const label = document.createElement("span");
            label.className = "prompt-label";
            label.textContent = "Prompt";

            const promptTags = document.createElement("div");
            promptTags.className = "prompt-tags";

            if (recycled && !regenerated) {
                const tag = document.createElement("span");
                tag.className = "tag recycled";
                tag.textContent = "recycled";
                promptTags.appendChild(tag);
            }

            if (regenerated) {
                const tag = document.createElement("span");
                tag.className = "tag regenerated";
                tag.textContent = "regenerated";
                promptTags.appendChild(tag);
            }

            const text = document.createElement("span");
            text.className = "prompt-text";
            text.title = String(prompt);
            text.textContent = String(prompt);

            promptLine.appendChild(label);
            promptLine.appendChild(promptTags);
            promptLine.appendChild(text);

            header.appendChild(promptLine);
        }

        const body = document.createElement("div");
        body.className = "response-body";
        body.textContent = response ?? "";

        entry.appendChild(header);
        entry.appendChild(body);
        responseBox.appendChild(entry);

        responseBox.scrollTop = responseBox.scrollHeight;
    }

    async function postReceiveMessage(payload){
        const res = await fetch("/api/receiveMessage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        return await res.json();
    }

    send.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text || busy) return;

        lastPrompt = text;
        setBusy(true);

        const data = await postReceiveMessage({ message: text });

        appendResponse({
            prompt: data.prompt ?? text,
            response: data.output ?? "",
            recycled: data.recycled === true,
            regenerated: false
        });

        feedback.style.display = data.recycled === true ? "flex" : "none";
        input.value = "";

        setBusy(false);
    });

    goodBtn.onclick = async () => {
        if (busy) return;
        feedback.style.display = "none";
    };

    badBtn.onclick = async () => {
        if (busy) return;
        setBusy(true);

        feedback.style.display = "none";

        if (!lastPrompt) {
            appendResponse({
                prompt: "",
                response: "No previous prompt to regenerate.",
                recycled: false,
                regenerated: true
            });
            setBusy(false);
            return;
        }

        const data = await postReceiveMessage({ message: lastPrompt });

        appendResponse({
            prompt: data.prompt ?? lastPrompt,
            response: data.output ?? "",
            recycled: data.recycled === true,
            regenerated: true
        });

        setBusy(false);
    };
</script>

</body>
</html>
