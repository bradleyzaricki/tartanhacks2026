<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root{
            --bg: #11110e;
            --panel: #171612;
            --border: #2b281f;
            --text: #f2efe6;
            --muted: #b9b19c;
            --accent: #7a8f5a;
            --accent2: #c2a66d;
            --radius: 14px;
            --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }

        *{ box-sizing: border-box }

        html, body{
            margin: 0;
            height: 100%;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
        }

        /* Tree button */
        .tree-btn{
            position: fixed;
            top: 14px;
            left: 14px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(122,143,90,0.5);
            background: rgba(122,143,90,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tree-btn:hover{
            background: rgba(122,143,90,0.25);
        }

        /* Center layout */
        .center{
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stack{
            width: min(720px, 92%);
            display: flex;
            flex-direction: column;
        }

        .input-box{
            display: flex;
            gap: 10px;
            padding: 10px;
            border-radius: var(--radius);
            background: var(--panel);
            border: 1px solid var(--border);
        }

        textarea{
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            padding: 10px;
        }

        textarea::placeholder{
            color: var(--muted);
        }

        button.send{
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(194,166,109,0.5);
            background: rgba(194,166,109,0.18);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        button.send:hover{
            background: rgba(194,166,109,0.28);
        }

        /* Feedback bar */
        .feedback{
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            background: rgba(23,22,18,0.85);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .feedback-text{
            font-size: 13px;
            color: var(--muted);
        }

        .feedback-actions{
            display: flex;
            gap: 8px;
        }

        .fb{
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            background: transparent;
            color: var(--text);
        }

        .fb.good{
            border-color: rgba(122,143,90,0.6);
            background: rgba(122,143,90,0.15);
        }

        .fb.good:hover{
            background: rgba(122,143,90,0.25);
        }

        .fb.bad{
            border-color: rgba(194,166,109,0.55);
            background: rgba(194,166,109,0.15);
        }

        .fb.bad:hover{
            background: rgba(194,166,109,0.28);
        }

        svg{ display:block }
    </style>
</head>

<body>

<!-- Tree icon -->
<button class="tree-btn" aria-label="Tree">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2c2.6 2 3.8 4.4 3.6 6.7 2.7.1 4.9 1.7 5.9 4.3-1.6.5-3.2.6-4.7.3.6 2.2-.4 4.7-2.5 6.3-1.2-.9-2.2-2-2.8-3.2-.7 1.2-1.6 2.3-2.8 3.2-2.1-1.6-3.1-4.1-2.5-6.3-1.5.3-3.1.2-4.7-.3 1-2.6 3.2-4.2 5.9-4.3C8.2 6.4 9.4 4 12 2Z"
              stroke="#c2a66d" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M12 12v10" stroke="#7a8f5a" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
</button>

<!-- Centered input + feedback -->
<div class="center">
    <div class="stack">
        <div class="input-box">
            <textarea id="input" rows="1" placeholder="Message…"></textarea>
            <button id="send" class="send">Send</button>
        </div>

        <div id="feedback" class="feedback">
            <span class="feedback-text">Was this a good recycled response?</span>
            <div class="feedback-actions">
                <button id="good" class="fb good">Good</button>
                <button id="bad" class="fb bad">Bad</button>
            </div>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const feedback = document.getElementById("feedback");

    send.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text) return;

        const res = await fetch("/api/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        console.log("Java response:", data.response);

        if (data.recycled === true) {
            feedback.style.display = "flex";
        } else {
            feedback.style.display = "none";
        }

        input.value = "";
    });

    document.getElementById("good").onclick = async () => {
        const res = await fetch("/api/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: "GOOD_RESPONSE" })
        });

        feedback.style.display = "none";

        const data = await res.json();
        console.log("Java response:", "Keep Response");
    };

    document.getElementById("bad").onclick = async () => {
        const res = await fetch("/api/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: "BAD_RESPONSE" })
        });

        feedback.style.display = "none";

        const data = await res.json();
        console.log("Java response:", "Discard Response");
    };

</script>

</body>
</html>
